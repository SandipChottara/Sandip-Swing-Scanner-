name: Run Backtest
# Manual only -- this is heavy (2y history for ~500 stocks, then a weekly
# re-scan across 12 months). Not something to run daily.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install yfinance pandas numpy requests
      - run: python backtest.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backtest.json
          git diff --staged --quiet || git commit -m "Backtest $(date -u +'%Y-%m-%d')"
          git push
